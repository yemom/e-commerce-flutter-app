# =============================================================================
# docker-compose.yml
# Orchestrates the API server and its MongoDB database for local development
# and production-equivalent environments.
#
# Services
#   app   — Node.js / Express API  (built from server/Dockerfile)
#   mongo — MongoDB 7 database     (official image)
#
# Usage
#   Start:   docker compose up -d --build
#   Logs:    docker compose logs -f app
#   Stop:    docker compose down
#   Wipe DB: docker compose down -v
# =============================================================================


# ---------------------------------------------------------------------------
# Named volume — MongoDB data persists across container restarts.
# ---------------------------------------------------------------------------
volumes:
  mongo_data:

# ---------------------------------------------------------------------------
# Shared network — services communicate by their service name, e.g.
#   MONGODB_URI=mongodb://mongo:27017/ecommerce_app
# ---------------------------------------------------------------------------
networks:
  backend:

services:

  # -------------------------------------------------------------------------
  # mongo — MongoDB 7 database
  # -------------------------------------------------------------------------
  mongo:
    image: mongo:7                 # Pinned major version for reproducibility.
    container_name: gulit_mongo
    restart: unless-stopped       # Auto-restart on host reboot; stop manually.

    # Load shared backend environment values.
    env_file:
      - ./server/.env

    environment:
      # Creates a root user on first boot — used only inside the container network.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongoAdmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: ecommerce_app

    volumes:
      - mongo_data:/data/db       # Persist data between restarts.

    networks:
      - backend

    healthcheck:
      # mongosh ping — confirms the daemon is accepting connections.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Expose to the host only for local debugging (e.g. Compass / mongosh).
    # Remove this block in a fully locked-down production environment.
    ports:
      - "27017:27017"


  # -------------------------------------------------------------------------
  # app — Node.js / Express API
  # -------------------------------------------------------------------------
  app:
    build:
      context: ./server           # Path to the directory that contains the Dockerfile.
      dockerfile: Dockerfile

    restart: unless-stopped

    # Load backend runtime values from server/.env.
    env_file:
      - ./server/.env

    depends_on:
      mongo:
        condition: service_healthy  # Wait until MongoDB is ready before starting.

    environment:
      NODE_ENV: production

      # Point the API at the in-network MongoDB service instead of Atlas.
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-mongoAdmin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/ecommerce_app?authSource=admin

      PORT: ${PORT:-8000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      # Super-admin credentials seeded on first startup.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@gulit.app}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in .env}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Admin}

      APP_NAME: ${APP_NAME:-Gulit}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      # SMTP — optional; email features degrade gracefully when unset.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

    volumes:
      # Named bind-mount so uploaded product images survive container rebuilds.
      - ./server/uploads:/app/uploads

    # The app port is no longer exposed to the host directly. Nginx proxies it.
    
    networks:
      - backend

    healthcheck:
      # Hit the /api/health endpoint defined in routes/health.js.
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # nginx — Load Balancer
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: gulit_lb
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - backend
